<article
  class="app-panel-card"
  [style.--tone-light]="selectedTone.light"
  [style.--tone-mid]="selectedTone.mid"
  [style.--tone-deep]="selectedTone.deep"
  [style.--tone-text]="selectedTone.text"
>
  <h3 class="app-panel-title">Entrada manual</h3>
  <p class="app-panel-subtitle">Ingresa el numero del billete para validarlo.</p>

  <div class="app-stack-md">
    <div class="app-row-between">
      <span class="app-section-label">Denominacion</span>
      <span class="app-series-badge">Serie B</span>
    </div>
    <div class="app-denomination-grid">
      @for (option of denominationOptions; track option) {
        <button
          type="button"
          class="app-denomination-chip"
          [class.is-selected]="denominationSelected === option"
          [style.--chip-light]="denominationPalette[option].light"
          [style.--chip-mid]="denominationPalette[option].mid"
          [style.--chip-deep]="denominationPalette[option].deep"
          [style.--chip-text]="denominationPalette[option].text"
          (click)="denominationSelected = option"
        >
          <span class="app-denomination-value">{{ option }} Bs</span>
        </button>
      }
    </div>

    <label class="app-section-label" for="serial-input">Numero</label>
    <input
      id="serial-input"
      type="text"
      [(ngModel)]="serialInput"
      (ngModelChange)="onSerialInputChange($event)"
      inputmode="numeric"
      pattern="[0-9]*"
      maxlength="9"
      placeholder="77100001"
      class="app-input"
    />
    <p class="app-hint-text">Ej: 77100001</p>
    <button type="button" (click)="verify()" class="app-btn app-btn-primary">Verificar</button>
  </div>
</article>
