<article class="rounded-2xl bg-white p-5 shadow-md ring-1 ring-slate-200 sm:p-6">
  <h3 class="text-lg font-semibold text-slate-900">Entrada manual</h3>
  <p class="mt-1 text-sm text-slate-600">Ingresa el número del billete para validarlo.</p>

  <div class="mt-4 space-y-3">
    <div class="flex items-center justify-between gap-2">
      <span class="text-xs font-semibold uppercase tracking-wide text-slate-500">Denominación</span>
      <span class="rounded-full bg-slate-100 px-2 py-1 text-xs font-semibold text-slate-700">Serie: B</span>
    </div>
    <div class="grid grid-cols-4 gap-2 rounded-xl bg-slate-100 p-1">
      @for (option of denominationOptions; track option) {
        <button
          type="button"
          (click)="denominationSelected = option"
          class="rounded-lg px-2 py-2 text-xs font-semibold transition sm:text-sm"
          [class.bg-white]="denominationSelected === option"
          [class.text-slate-900]="denominationSelected === option"
          [class.shadow]="denominationSelected === option"
          [class.text-slate-600]="denominationSelected !== option"
        >
          {{ option === 'AUTO' ? 'Auto' : option }}
        </button>
      }
    </div>

    <label class="block text-xs font-semibold uppercase tracking-wide text-slate-500" for="serial-input">
      Número
    </label>
    <input
      id="serial-input"
      type="text"
      [(ngModel)]="serialInput"
      placeholder="77100001"
      class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-sm outline-none transition focus:border-slate-500 focus:ring-2 focus:ring-slate-300"
    />
    <p class="text-xs text-slate-500">Ej: 77100001 o 77100001B</p>
    <button
      type="button"
      (click)="verify()"
      class="w-full rounded-xl bg-slate-900 px-4 py-3 text-sm font-semibold text-white transition hover:bg-slate-800"
    >
      Verificar
    </button>
  </div>
</article>
