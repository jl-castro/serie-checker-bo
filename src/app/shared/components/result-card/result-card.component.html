<article class="rounded-2xl bg-white p-5 shadow-md ring-1 ring-slate-200 sm:p-6">
  <header class="flex items-start justify-between gap-4">
    <div>
      <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Estado de verificacion</p>
      <h3 class="mt-1 text-2xl font-black tracking-tight text-slate-900">{{ status | uppercase }}</h3>
    </div>
    <span
      class="inline-flex items-center rounded-full px-3 py-1 text-xs font-bold ring-1"
      [ngClass]="statusClass"
    >
      {{ status }}
    </span>
  </header>

  <dl class="mt-5 grid grid-cols-1 gap-3 rounded-xl bg-slate-50 p-4 sm:grid-cols-2">
    <div>
      <dt class="text-xs font-semibold uppercase tracking-wide text-slate-500">Serie</dt>
      <dd class="mt-1 text-base font-semibold text-slate-800">{{ series }}</dd>
    </div>
    <div>
      <dt class="text-xs font-semibold uppercase tracking-wide text-slate-500">Número</dt>
      <dd class="mt-1 text-base font-semibold text-slate-800">{{ serialNormalized ?? 'Sin dato' }}</dd>
    </div>
    @if (status === 'INVALID' && denominationMatched) {
      <div>
        <dt class="text-xs font-semibold uppercase tracking-wide text-slate-500">Denominacion</dt>
        <dd class="mt-1 text-base font-semibold text-slate-800">Bs {{ denominationMatched }}</dd>
      </div>
    }
  </dl>

  <p class="mt-4 text-sm leading-relaxed text-slate-700">{{ message }}</p>
</article>
